<svg xmlns="http://www.w3.org/2000/svg"
     width="172mm" height="113mm" viewBox="0 0 172 113">
  <rect x="0" y="0" width="172" height="113" fill="white"/>
  <g fill="none" stroke="black" stroke-width="0.35" stroke-linejoin="miter">
    <!-- four lateral faces: LxH, WxH, LxH, WxH -->
    <rect x="5"   y="35" width="51" height="43"/>
    <rect x="56"  y="35" width="30" height="43"/>
    <rect x="86"  y="35" width="51" height="43"/>
    <rect x="137" y="35" width="30" height="43"/>
    <!-- top and bottom faces attached to first LxH face -->
    <rect x="5" y="5"  width="51" height="30"/>
    <rect x="5" y="78" width="51" height="30"/>
  </g>
</svg>
