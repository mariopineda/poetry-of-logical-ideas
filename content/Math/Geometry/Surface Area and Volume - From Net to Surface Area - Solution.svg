<svg xmlns="http://www.w3.org/2000/svg"
     width="190mm" height="190mm" viewBox="0 0 190 190">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="black"/>
    </marker>
    <marker id="arrowStart" markerWidth="6" markerHeight="6" refX="1" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M6,0 L0,3 L6,6 z" fill="black"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="190" height="190" fill="white"/>

  <!-- labelled net -->
  <g fill="none" stroke="black" stroke-width="0.35" stroke-linejoin="miter">
    <rect x="14"  y="38" width="51" height="43"/>
    <rect x="65"  y="38" width="30" height="43"/>
    <rect x="95"  y="38" width="51" height="43"/>
    <rect x="146" y="38" width="30" height="43"/>
    <rect x="14" y="8"  width="51" height="30"/>
    <rect x="14" y="81" width="51" height="30"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="4.2" text-anchor="middle" fill="black">
    <text x="39.5" y="60">5.1 cm × 4.3 cm</text>
    <text x="80" y="60">3.0 cm × 4.3 cm</text>
    <text x="120.5" y="60">5.1 cm × 4.3 cm</text>
    <text x="161" y="60">3.0 cm × 4.3 cm</text>
    <text x="39.5" y="24">5.1 cm × 3.0 cm</text>
    <text x="39.5" y="98">5.1 cm × 3.0 cm</text>
  </g>

  <!-- 3D rectangular prism -->
  <g fill="none" stroke="black" stroke-width="0.5" stroke-linejoin="round">
    <!-- front -->
    <rect x="50" y="135" width="70" height="38"/>
    <!-- depth offset -->
    <line x1="50" y1="135" x2="66" y2="123"/>
    <line x1="120" y1="135" x2="136" y2="123"/>
    <line x1="120" y1="173" x2="136" y2="161"/>
    <line x1="66" y1="123" x2="136" y2="123"/>
    <line x1="136" y1="123" x2="136" y2="161"/>
    <line x1="136" y1="161" x2="120" y2="173"/>
  </g>

  <!-- dimension arrows -->
  <g fill="none" stroke="black" stroke-width="0.35"
     marker-start="url(#arrowStart)" marker-end="url(#arrow)">
    <line x1="50" y1="180" x2="120" y2="180"/>
    <line x1="43" y1="135" x2="43" y2="173"/>
    <line x1="124" y1="131" x2="137" y2="121"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="4.5" fill="black">
    <text x="85" y="187" text-anchor="middle">5.1 cm</text>
    <text x="35" y="155" text-anchor="middle" transform="rotate(-90 35 155)">4.3 cm</text>
    <text x="137" y="116" text-anchor="middle">3.0 cm</text>
  </g>
</svg>
