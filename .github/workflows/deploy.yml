name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Enforce student-facing Osculatorium UI
        run: node scripts/enforce-osculatorium-ui.mjs

      - name: Restore Osculatorium Universe visuals
        run: node scripts/enforce-osculatorium-universe.cjs quartz/static/qod-graph.js quartz/styles/qod-graph.scss

      - name: Polish Osculatorium Universe details
        run: node scripts/polish-osculatorium-universe.mjs

      - name: Restore QOD two-star path explorer
        run: node scripts/enforce-osculatorium-path-explorer.cjs quartz/static/qod-graph.js

      - name: Enforce QOD Presentation Mode
        run: node scripts/enforce-qod-presentation.mjs

      - name: Restore Osculatorium Universe expanded view
        run: node scripts/enforce-osculatorium-universe-stage.cjs quartz/static/qod-graph.js quartz/styles/qod-graph.scss

      - name: Enforce intuitive graph reset controls
        run: node scripts/enforce-osculatorium-graph-controls.cjs quartz/static/qod-graph.js

      - name: Enforce Mental Math Race generator
        run: node scripts/enforce-mental-math-race.cjs

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4